short_bio: >-
  <p>
    I am a final-year undergraduate student in Computer Science at the University of Science and Technology of China (USTC), and I will join <a href="https://miralab.ai/">MIRA Lab</a> as a graduate student in 2027.
  </p>
  <p>
    My research focuses on <b>LLM post-training</b>, especially <b>agentic reinforcement learning</b> — training language agents to plan, use tools, and recover from failures. I am also interested in reliable evaluation of agent behavior, and in building agents that are genuinely useful outside a demo.
  </p>

