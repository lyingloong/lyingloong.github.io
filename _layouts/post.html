---
layout: default
---

<article class="blog-post">
    <header class="blog-post-header">
        <p class="blog-post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
        <h1>{{ page.title }}</h1>
        {% if page.description %}<p class="blog-post-description">{{ page.description }}</p>{% endif %}
        {% if page.tags and page.tags.size > 0 %}
        <div class="blog-post-tags" aria-label="Tags">
            <span class="blog-post-tags-label">Topics:</span>
            {% for tag in page.tags %}<span class="blog-post-tag">{{ tag }}</span>{% endfor %}
        </div>
        {% endif %}
    </header>

    <div class="blog-post-content">
        {{ content }}
    </div>
</article>
