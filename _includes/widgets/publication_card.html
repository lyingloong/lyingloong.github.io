{% assign publications = include.publications %}
<section class="home-section" aria-labelledby="publications-heading">
    <div class="section-heading">
        <h2 id="publications-heading">{{ include.title | default: 'Selected Publications' }}</h2>
        <a href="{{ '/publications' | relative_url }}">All publications <span aria-hidden="true">&rarr;</span></a>
    </div>
    <div class="publication-list">
        {% for item in publications limit:include.limit %}
            {% include widgets/publication_item.html item=item %}
        {% endfor %}
    </div>
</section>
