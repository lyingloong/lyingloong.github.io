{% assign item = include.item %}
<article class="honor-entry">
    <time class="entry-date" datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: '%b %Y' }}</time>
    <h3 class="entry-title">
        {% if item.certificate %}
        <a href="{{ item.certificate | relative_url }}" target="_blank" rel="noopener">{{ item.title }}</a>
        {% else %}
        {{ item.title }}
        {% endif %}
    </h3>
</article>
