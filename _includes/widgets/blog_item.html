{% assign item = include.item %}
<article class="writing-entry">
    <time class="entry-date" datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: '%b %d, %Y' }}</time>
    <h3 class="entry-title"><a href="{{ item.url | relative_url }}">{{ item.title }}</a></h3>
    {% if item.description %}<p class="entry-description">{{ item.description }}</p>{% endif %}
    {% if item.tags.size > 0 %}
    <p class="blog-post-tags">{% for tag in item.tags %}<span class="blog-post-tag">{{ tag }}</span>{% endfor %}</p>
    {% endif %}
</article>
