<section class="home-section" aria-labelledby="honors-heading">
    <div class="section-heading">
        <h2 id="honors-heading">{{ include.title | default: 'Selected Honors' }}</h2>
        <a href="{{ '/honors' | relative_url }}">All honors <span aria-hidden="true">&rarr;</span></a>
    </div>
    <div class="honor-list">
        {% for item in include.honors limit:include.limit %}
            {% include widgets/honor_item.html item=item %}
        {% endfor %}
    </div>
</section>
