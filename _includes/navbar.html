<header class="site-header">
    <nav class="site-container site-nav" aria-label="Main navigation">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.data.profile.primary_name }}</a>
        <ul class="site-nav-links">
            {% for item in site.data.navigation.pages %}
            <li>
                <a href="{{ item.url | relative_url }}"{% if item.name == page.navbar_title %} aria-current="page"{% endif %}>{{ item.name }}</a>
            </li>
            {% endfor %}
        </ul>
    </nav>
</header>
